name: nba
version: "0.1.0"
config-version: 2
profile: nba

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

seeds:
  nba:
    +schema: reference
    all_star_games:
      +column_types:
        all_star_date: date

models:
  nba:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
