version: 2

models:
  - name: player_game_stats
    description: >
      One row per player per game with box-score stats, shooting efficiency
      (eFG%, TS%), usage rate and Game Score. Includes players who were
      active but did not play (played = false).
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, player_id]
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: team_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_team_game_logs')
                field: team_id
      - name: ts_pct
        description: True shooting %, pts / (2 * (fga + 0.44 * fta)). Null with no shot attempts.
      - name: efg_pct
        description: Effective FG %, counts a made three as 1.5 makes.
      - name: usage_rate
        description: Approximate share of team possessions used while on the floor (0–1).
      - name: game_score
        description: Hollinger's Game Score, a single-number summary of a box score.

  - name: shot_events
    description: >
      One row per field goal attempt from play-by-play: shooter, shot type,
      distance, court location, make/miss, points, the score margin before
      the shot, and whether it was a clutch shot.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, action_id]
    columns:
      - name: game_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_team_game_logs')
                field: game_id
      - name: shot_made
        data_tests: [not_null]
      - name: shot_distance
        description: Distance from the basket in feet.
      - name: x_legacy
        description: Court x position in tenths of a foot from the basket (legacy NBA shot-chart units).
      - name: margin_before
        description: Shooting team's lead (negative when trailing) just before the shot.
      - name: is_clutch
        description: Last 5:00 of the 4th quarter or overtime with the score within 5 points (NBA definition).

  - name: team_pace
    description: >
      One row per team per game with estimated possessions, pace and
      offensive/defensive/net rating. season_phase splits the regular season
      at the All-Star Game, e.g. to compare pace before and after the break.
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team_id]
    columns:
      - name: game_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: possessions
        description: Box-score possession estimate, averaged across both teams.
        data_tests: [not_null]
      - name: pace
        description: Possessions per 48 minutes.
        data_tests: [not_null]
      - name: season_phase
        description: pre_all_star, post_all_star or playoffs. Null for a season missing from the all_star_games seed.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pre_all_star, post_all_star, playoffs]
