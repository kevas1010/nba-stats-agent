version: 2

sources:
  - name: raw
    description: Tables landed by `nba-ingest` from stats.nba.com via nba_api.
    schema: raw
    tables:
      - name: team_game_logs
        description: One row per team per game (LeagueGameLog, team level).
      - name: player_game_logs
        description: One row per player per game (LeagueGameLog, player level).
      - name: schedule
        description: League schedule for the current season, including unplayed games.
      - name: play_by_play
        description: Every event of every logged game (PlayByPlayV3), one row per action.
